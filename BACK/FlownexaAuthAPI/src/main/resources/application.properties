spring.application.name=app
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/flownexaDB
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.springframework.security=DEBUG

#spring.sql.init.mode=always
#spring.sql.init.platform=postgres
#spring.sql.init.schema-locations=classpath:db/schema.sql

#spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=${JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:900000}
jwt.issuer=login-api

app.password-reset.expiration-minutes=15
app.password-reset.url=http://localhost:3000/reset-password